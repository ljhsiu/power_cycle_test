# =============================================================================
#  艾德克斯（ITECH）电源自动上下电测试配置
#
#  说明：
#    - 修改后建议先执行 ./power_cycle_test.sh -n 干跑校验，再正式运行。
#    - 注释以 # 开头；值必须是 YAML 格式（字符串可用引号包起来）。
#    - 所有时间单位均为“秒”，电压单位 V，电流单位 A。
# =============================================================================

# 连接方式：
#   serial —— 电源的 USB 口在系统中显示为虚拟串口（Windows 的 COMx / Linux 的
#             /dev/ttyUSBx、/dev/ttyACMx），用 pyserial 直接发 SCPI。绝大多数
#             ITECH 电源（IT6300 / IT8500+ / IT6722 等）都是这种方式。
#   mock   —— 模拟电源，不连硬件，用于验证脚本流程、计时和记录是否正常。
transport: "serial"

# -----------------------------------------------------------------------------
# 串口参数
# -----------------------------------------------------------------------------
serial:
  # Windows 写 "COM5"；Linux 写 "/dev/ttyUSB0"；写 "auto" 则自动识别 USB 串口。
  # 插拔 USB 后 COM 号可能变化，长期使用建议写 auto。
  port: "auto"

  # ITECH 电源默认 9600；若你的机器设成了 115200，这里同步改。
  baudrate: 9600

  # 数据格式 8N1：8 数据位、无校验、1 停止位（与电源菜单 Communication 一致）
  bytesize: 8
  parity: "N"
  stopbits: 1

  # 读写超时（秒），*RST 之类较慢的命令可适当加大
  timeout: 2.0

  # 命令结尾符。ITECH 一般 \n 即可；个别固件要求 \r\n，用 \r\n 兼容性最好。
  write_terminator: "\r\n"
  read_terminator: "\n"

  # 每条命令之间的间隔（秒），避免电源处理不过来导致命令丢失
  command_delay: 0.05

  # 流控，一般保持 false
  xonxoff: false
  rtscts: false
  dsrdtr: false

# -----------------------------------------------------------------------------
# 测试参数：核心配置
# -----------------------------------------------------------------------------
test:
  voltage: 12.0       # 输出电压（V）
  current: 2.0        # 电流上限（A），即 CC 限流点
  on_time: 10         # 上电保持时间（秒）：输出 ON 后保持多久再断电
  off_time: 10        # 间隔时间（秒）：断电后等待多久再进入下一次上电
  cycles: 5           # 循环次数；0 表示无限循环，直到 Ctrl+C
  settle_time: 0.5    # 上电后等待多久再测量（秒），让输出稳定

# -----------------------------------------------------------------------------
# 测量与记录
# -----------------------------------------------------------------------------
measurement:
  enabled: true       # 每轮上电后回读电压/电流（需要电源支持 MEAS:VOLT?/CURR?）
  csv: true           # 是否写 CSV 记录
  csv_file: ""        # 留空则自动生成 logs/measurements_时间戳.csv，也可写绝对路径

# -----------------------------------------------------------------------------
# 安全限制
# -----------------------------------------------------------------------------
safety:
  # 防止手误把电压/电流填得过大；0 表示不检查
  max_voltage: 30
  max_current: 5

  # 连接后校验 *IDN? 是否包含关键字，防止连错串口（例如连到了别的仪器）
  check_idn: true
  idn_keyword: "ITECH"

# -----------------------------------------------------------------------------
# SCPI 命令模板
#   不同型号 / 固件可能有细微差别，脚本不写死命令，改这里即可。
#   {voltage} / {current} 会被替换成设定值。
# -----------------------------------------------------------------------------
scpi:
  identify: "*IDN?"
  reset: "*CLS"
  remote_enable: "SYST:REM"     # 进入远程模式、锁定面板；留空 "" 则不发
  local_enable: "SYST:LOC"      # 测试结束时恢复面板控制；留空 "" 则不发
  set_voltage: "VOLT {voltage}"
  set_current: "CURR {current}"
  output_on: "OUTP ON"
  output_off: "OUTP OFF"
  measure_voltage: "MEAS:VOLT?"
  measure_current: "MEAS:CURR?"

# -----------------------------------------------------------------------------
# 日志
# -----------------------------------------------------------------------------
logging:
  file: true          # 同时写日志文件（每次运行一个，便于追溯）
  dir: "logs"         # 相对路径以 config.yaml 所在目录为基准

# -----------------------------------------------------------------------------
# 重试
# -----------------------------------------------------------------------------
retry:
  connect_attempts: 3     # 打开串口并握手失败时的重试次数
  connect_interval: 2     # 两次重试之间等待（秒）
  command_attempts: 2     # 单条命令发送失败时的重试次数
